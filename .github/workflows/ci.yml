name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: node --test tests/extension_policy_tests.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official MCP client compatibility
        run: |
          python -m pip install mcp==1.30.0
          python scripts/smoke_mcp_sdk.py --binary target/debug/exfetch
      - name: Real Chromium extension integration
        run: |
          npm install --prefix "$RUNNER_TEMP/exfetch-browser" playwright@1.58.2
          "$RUNNER_TEMP/exfetch-browser/node_modules/.bin/playwright" install --with-deps chromium
          EXFETCH_PLAYWRIGHT_MODULE="$RUNNER_TEMP/exfetch-browser/node_modules/playwright" node scripts/smoke_browser.cjs target/debug/exfetch
